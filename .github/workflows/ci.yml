# CI/CD: mỗi lần push/PR → test + build trên máy sạch.
# Chỉ khi cả hai xanh VÀ là push lên main → deploy lên Railway → smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push mới lên cùng nhánh thì hủy lần chạy cũ, tránh hai bản deploy đua nhau
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (CP1-CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # CP5 gọi vào bản deploy đang sống, bonus kiểm tra badge của chính
      # workflow này → loại ra. Test build Docker để job `build` lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy-key
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      # Không chỉ build được mà còn phải khởi động được và /health trả 200
      - name: Run container and check /health
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy-key -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Account token (gói trial không tạo được Project Token) → CLI đọc
      # qua RAILWAY_API_TOKEN, nên phải chỉ rõ project/environment/service.
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 59558abc-a8f7-48ed-bfcd-73acd4eab142
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://day12-agent-production-87a0.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.62.1

      - name: Deploy
        run: >
          railway up --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment production
          --service day12-agent

      # Deploy xong chưa đủ — phải chắc service còn sống
      - name: Smoke test
        run: |
          sleep 45
          curl -fsS "$PUBLIC_URL/health"
          curl -fsS "$PUBLIC_URL/ready"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PUBLIC_URL/ask" \
            -H "Content-Type: application/json" -d '{"question":"ci"}')
          test "$code" = "401"
